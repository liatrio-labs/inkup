<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Start a review Session</title>
</head>
<body class="m-0 overflow-hidden bg-transparent">
  <!-- The look is the toolbar's own Start (packages/ui/src/toolbar/toolbar.tsx: BUTTON, PRIMARY, FOCUS) on the package
       theme, which main.ts loads. -->
  <!-- Disabled until main.ts listens: a click before that would do nothing (F1). -->
  <button
    type="button"
    id="start"
    data-testid="toolbar-start"
    class="box-border block h-[26px] w-full cursor-pointer rounded-sm bg-primary px-2 text-center font-sans text-xs leading-none font-semibold text-primary-foreground transition-colors duration-150 ease-[cubic-bezier(0.16,1,0.3,1)] hover:bg-ink-2 focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-solid focus-visible:outline-ring disabled:cursor-default disabled:opacity-45 disabled:hover:bg-primary"
    disabled
  >Start</button>
  <script type="module" src="./main.ts"></script>
</body>
</html>
