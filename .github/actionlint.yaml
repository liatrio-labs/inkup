# actionlint config. Ignores are path-and-rule narrow.
#
# inkup-v-release.yml is generated by cargo-dist (`dist generate`, from dist-workspace.toml) and must not be
# hand-edited: host-dist-check's `dist generate --check` fails on any drift. The shellcheck notes below are in
# dist's template (an unquoted $GITHUB_PATH, an unquoted $PRERELEASE_FLAG that is either empty or one flag, and
# repeated redirects to $GITHUB_OUTPUT). No dist setting changes them. Upgrading dist means re-reading this
# ignore. The same file is the only zizmor exception, in .github/zizmor.yml, for the same reason. Every other
# workflow is checked in full, including shellcheck.
paths:
  .github/workflows/inkup-v-release.yml:
    ignore:
      # SC2086: unquoted $GITHUB_PATH and $PRERELEASE_FLAG in dist's template.
      - 'shellcheck reported issue in this script: SC2086:'
      # SC2129: style-only grouped-redirect note on dist's GITHUB_OUTPUT writes.
      - 'shellcheck reported issue in this script: SC2129:'
