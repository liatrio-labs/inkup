name: Release

# Push a tag like v0.2.0 on a commit that is already on main.
# The tag must equal extensions/web/package.json "version" (which becomes the manifest version).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      zip: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is on main and matches the extension's package.json version
        run: |
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release only commits that passed CI on main."
            exit 1
          fi
          pkg="v$(node -p 'require("./extensions/web/package.json").version')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm zip
      - id: zip
        run: echo "name=$(basename extensions/web/.output/*-chrome.zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-zip
          path: extensions/web/.output/*-chrome.zip
          # .output is a dot directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

  github-release:
    name: github-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-zip
      - name: Create GitHub Release with the Chrome zip
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  chrome-web-store:
    name: chrome-web-store
    needs: build
    runs-on: ubuntu-latest
    # Environment is restricted to v* tags. Required reviewers need a paid
    # plan on private repos; see docs/releasing.md.
    environment: chrome-web-store
    env:
      CHROME_API_VERSION: v2
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      CHROME_SKIP_SUBMIT_REVIEW: ${{ vars.CHROME_SKIP_SUBMIT_REVIEW || 'false' }}
    steps:
      - name: Skip when store credentials are not configured
        id: creds
        run: |
          for v in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL CHROME_SERVICE_ACCOUNT_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::notice::$v is not set; skipping Chrome Web Store upload. See docs/releasing.md."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-zip
          path: extensions/web/dist-release
      - if: steps.creds.outputs.ready == 'true'
        name: Upload to the Chrome Web Store and submit for review
        working-directory: extensions/web
        env:
          ZIP: ${{ needs.build.outputs.zip }}
        run: pnpm exec wxt submit --chrome-zip "dist-release/$ZIP"
