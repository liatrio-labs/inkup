name: Chrome extension release

# Runs on the extension train's tag, inkup-extension-v<version>, which release-please creates when its release
# pull request is merged; the same tag starts firefox-release.yml. A hand-pushed inkup-chrome-v<version> tag releases
# this store alone. Either tag must be on main and end in extensions/web/package.json "version" (the manifest version).
on:
  push:
    tags: ["inkup-extension-v*.*.*", "inkup-chrome-v*.*.*"]

permissions:
  contents: read

concurrency:
  group: chrome-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      zip: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is on main and matches the extension's package.json version
        run: |
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release only commits that passed CI on main."
            exit 1
          fi
          version="$(node -p 'require("./extensions/web/package.json").version')"
          case "$GITHUB_REF_NAME" in
            "inkup-extension-v$version" | "inkup-chrome-v$version") ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
              exit 1
              ;;
          esac
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm zip
        env:
          INKUP_RELEASE_BUILD: "1"
      - id: zip
        run: echo "name=$(basename extensions/web/.output/*-chrome.zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-zip
          path: extensions/web/.output/*-chrome.zip
          # .output is a dot directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

  github-release:
    name: github-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-zip
      # release-please has made the release for an inkup-extension-v tag, and both extension workflows add their zip to
      # it. A hand-pushed tag has none yet.
      - name: Add the Chrome zip to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  chrome-web-store:
    name: chrome-web-store
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment is restricted to inkup-extension-v* and inkup-chrome-v* tags. Required reviewers need a paid
    # plan on private repos; see docs/releasing.md.
    environment: chrome-web-store
    # id-token: keyless Google auth. The workload identity provider admits only this repo's OIDC tokens from the
    # chrome-web-store environment, so no Google key is stored anywhere.
    permissions:
      contents: read
      id-token: write
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SKIP_SUBMIT_REVIEW: ${{ vars.CHROME_SKIP_SUBMIT_REVIEW || 'false' }}
    steps:
      - name: Skip when store credentials are not configured
        id: creds
        run: |
          for v in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID; do
            if [ -z "${!v}" ]; then
              echo "::notice::$v is not set; skipping Chrome Web Store upload. See docs/releasing.md."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-zip
          path: extensions/web/dist-release
      - if: steps.creds.outputs.ready == 'true'
        name: Authenticate to Google Cloud (keyless, workload identity federation)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/600628809675/locations/global/workloadIdentityPools/github/providers/liatrio-labs-inkup
          service_account: inkup-cws-upload@inkup-cws.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - if: steps.creds.outputs.ready == 'true'
        name: Upload to the Chrome Web Store and submit for review
        env:
          CHROME_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: node scripts/chrome-web-store.ts "extensions/web/dist-release/$ZIP"
