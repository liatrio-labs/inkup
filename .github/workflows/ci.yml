name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly full suite, off the hour. A pull request stays path-routed and narrows tests inside each area.
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The nightly does not share main's group, so a push does not wait behind it.
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12"
  RUST_VERSION: "1.98"
  CARGO_TERM_COLOR: always

jobs:
  # Which side of the contract the change touches (scripts/ci-changes.ts, ADR 0007): contract/ runs both sides and
  # the breaking-change guard, host/ the host, the rest of the workspace the extension, docs lint alone. The desktop
  # app runs for apps/desktop and for what it is built from (host/, packages/, the lockfile); the site (apps/site, ADR
  # 0026) for apps/site, the lockfile and release-please's manifest, and nothing else for it. The x86_64 macOS cross
  # build runs for host/, dist-workspace.toml, and any path that runs everything. `ui` gates the advisory design
  # job. A push to main and the nightly run every area, including design. A push with no usable base runs
  # everything except the contract guard. A release pull request
  # (release-please--*) runs nothing: it only bumps versions and
  # changelogs of code that was tested on its own pull request (ADR 0027), so every job skips and ci-ok passes.
  changes:
    name: changes
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      extension: ${{ steps.diff.outputs.extension }}
      host: ${{ steps.diff.outputs.host }}
      contract: ${{ steps.diff.outputs.contract }}
      desktop: ${{ steps.diff.outputs.desktop }}
      site: ${{ steps.diff.outputs.site }}
      x64_macos: ${{ steps.diff.outputs.x64_macos }}
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eo pipefail
          plan=$(node scripts/ci-full-suite.ts areas "$EVENT_NAME")
          mode=${plan%%$'\n'*}
          if [ "$mode" = full ]; then
            echo "Full suite: $EVENT_NAME treats every area as changed."
            printf '%s\n' "${plan#*"$mode"$'\n'}" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! files=$(git diff --name-only "$BASE...$HEAD"); then
            echo "No base to diff against; running everything."
            printf 'extension=true\nhost=true\ncontract=false\ndesktop=true\nsite=true\nx64_macos=true\nui=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | node scripts/ci-changes.ts | tee -a "$GITHUB_OUTPUT"

  # A contract change must not break an older peer unless it bumps the version (scripts/contract-compat.ts, ADR 0007):
  # the extension and the host are released on their own, so an installed pair is often out of step.
  contract-compat:
    name: contract-compat
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The checkout is what would land (a pull request's merge commit), so this compares it with the base as is.
      # A nightly has no base SHA; the previous commit is the comparison, and a green main has nothing to break.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eo pipefail
          ref="$BASE"
          if [ -z "$ref" ] || [ "$ref" = "0000000000000000000000000000000000000000" ]; then
            ref=HEAD~1
          fi
          node scripts/contract-compat.ts "$ref"

  # The pre-commit hooks (Biome, markdownlint, zizmor, file hygiene) over every file, and gitleaks over the whole
  # history. host.yml runs the cargo hooks; gitleaks's hook only reads staged changes, so it runs as a step here.
  lint:
    name: lint
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pre-commit
        env:
          SKIP: cargo-fmt,cargo-clippy,gitleaks
        run: pipx run pre-commit==4.6.0 run --all-files --show-diff-on-failure
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  # packages/core, packages/protocol and packages/ui: pure TS, no browser. Fast, and the host work builds on
  # core. A pull request runs these three in full. Their tests read the tree from disk, and ui also reads DESIGN.md.
  core:
    name: core
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core typecheck
      - run: pnpm -C packages/protocol typecheck
      - name: Unit tests
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eo pipefail
          # core, protocol and ui scan their trees from disk and finish in a few seconds.
          args_text=$(printf '\n' | node scripts/ci-full-suite.ts vitest "$EVENT_NAME" core)
          mapfile -t args <<< "$args_text"
          {
            echo "### vitest (core, protocol, ui)"
            echo '```'
            printf '%s\n' "${args[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm -C packages/core exec vitest "${args[@]}"
          pnpm -C packages/protocol exec vitest "${args[@]}"
          pnpm -C packages/ui exec vitest "${args[@]}"

  # The Chrome build of extensions/web: typecheck and unit tests for the whole workspace, schema sync, the zip.
  # A pull request runs vitest --changed only when every non-doc file is a package TypeScript module.
  extension-chrome:
    name: extension-chrome
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            files=$(git diff --name-only "$BASE_SHA...HEAD" || true)
          else
            files=
          fi
          args_text=$(printf '%s\n' "$files" | node scripts/ci-full-suite.ts vitest "$EVENT_NAME" all)
          mapfile -t args <<< "$args_text"
          if printf '%s\n' "${args[@]}" | grep -qx -- --changed; then
            git fetch --no-tags origin main
          fi
          {
            echo "### vitest"
            echo '```'
            printf '%s\n' "${args[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm exec vitest "${args[@]}"
      - name: Session and protocol JSON schemas are in sync
        run: pnpm schema && git diff --exit-code -- contract
      - run: pnpm zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-zip
          path: extensions/web/.output/*-chrome.zip
          # .output is a dot directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Split three ways, one runner each: a third of the specs per shard, and no runner busier than one worker. The e2e
  # drives the extension against the real host (host.spec.ts), the one test of both sides together, so it runs when
  # either side changes. A pull request runs the specs scripts/affected-e2e.ts names for the diff; main and the
  # nightly run the suite. A shard with no selected spec passes.
  extension-chrome-e2e:
    name: extension-chrome-e2e (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: plan
        name: Choose Chrome specs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -eo pipefail
          plan="$RUNNER_TEMP/e2e-plan.txt"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            printf 'all\n' | tee "$plan"
          elif [ -z "$BASE_SHA" ] || ! files=$(git diff --name-only "$BASE_SHA...HEAD"); then
            echo "No base to diff against; running the full Chrome suite."
            printf 'all\n' | tee "$plan"
          else
            printf '%s\n' "$files" | node scripts/affected-e2e.ts chrome | tee "$plan"
          fi
          mode=$(head -n 1 "$plan")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### Chrome e2e ($SHARD/3)"
            echo '```'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: success() && steps.plan.outputs.mode != 'none'
        run: pnpm install --frozen-lockfile
      - if: success() && steps.plan.outputs.mode != 'none'
        name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # host.spec.ts spawns the real host; `pnpm test:e2e` builds it (`pnpm host:build`).
      - if: success() && steps.plan.outputs.mode != 'none'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-12
        with:
          toolchain: "1.98"
      - if: success() && steps.plan.outputs.mode != 'none'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host
      # Builds the extension (and the host), then runs the selected specs headless
      # against bundled Chromium with fake media. Live-API evals and the
      # Whisper download spec are opt-in and never run here.
      # One Chromium log per test (tests/e2e/fixtures.ts), kept with the report on failure: a renderer crash
      # otherwise leaves only a timeout.
      - if: success() && steps.plan.outputs.mode != 'none'
        env:
          SHARD: ${{ matrix.shard }}
          E2E_CHROME_LOG_DIR: ${{ github.workspace }}/chrome-logs
        run: |
          set -eo pipefail
          mkdir -p chrome-logs
          mode=$(head -n 1 "$RUNNER_TEMP/e2e-plan.txt")
          if [ "$mode" = all ]; then
            pnpm test:e2e --shard="$SHARD/3"
          else
            mapfile -t specs < <(tail -n +2 "$RUNNER_TEMP/e2e-plan.txt" | sed '/^$/d')
            if [ "${#specs[@]}" -eq 0 ]; then
              echo "The spec plan named no files."
              exit 1
            fi
            pnpm test:e2e --shard="$SHARD/3" --pass-with-no-tests "${specs[@]}"
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            chrome-logs/
          retention-days: 7

  # The Firefox build of extensions/web: the add-on zip, and the Firefox e2e (the add-on is installed over
  # Firefox's remote debugging protocol; tests/e2e-firefox/fixtures.ts). A pull request runs the specs
  # scripts/affected-e2e.ts names; main and the nightly run the suite. No selected spec skips the build.
  extension-firefox:
    name: extension-firefox
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: plan
        name: Choose Firefox specs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eo pipefail
          plan="$RUNNER_TEMP/e2e-plan.txt"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            printf 'all\n' | tee "$plan"
          elif [ -z "$BASE_SHA" ] || ! files=$(git diff --name-only "$BASE_SHA...HEAD"); then
            echo "No base to diff against; running the full Firefox suite."
            printf 'all\n' | tee "$plan"
          else
            printf '%s\n' "$files" | node scripts/affected-e2e.ts firefox | tee "$plan"
          fi
          mode=$(head -n 1 "$plan")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### Firefox e2e"
            echo '```'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: success() && steps.plan.outputs.mode != 'none'
        run: pnpm install --frozen-lockfile
      - if: success() && steps.plan.outputs.mode != 'none'
        name: Install Playwright Firefox
        run: pnpm exec playwright install --with-deps firefox
      # network-host.spec.ts spawns the real host.
      - if: success() && steps.plan.outputs.mode != 'none'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-12
        with:
          toolchain: "1.98"
      - if: success() && steps.plan.outputs.mode != 'none'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host
      - if: success() && steps.plan.outputs.mode != 'none'
        run: pnpm host:build
      # Firefox on Linux needs what a desktop has: a sound server (with none, an AudioContext's resume() and close()
      # hang and every Stop waits out its backstop) and a display (headless, getDisplayMedia has no source and the
      # Session records no video). A null sink and Xvfb stand in for them.
      - if: success() && steps.plan.outputs.mode != 'none'
        name: Start a sound server
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
      - if: success() && steps.plan.outputs.mode != 'none'
        env:
          HEADED: "1"
        run: |
          set -eo pipefail
          mode=$(head -n 1 "$RUNNER_TEMP/e2e-plan.txt")
          if [ "$mode" = all ]; then
            xvfb-run -a pnpm test:e2e:firefox
          else
            mapfile -t specs < <(tail -n +2 "$RUNNER_TEMP/e2e-plan.txt" | sed '/^$/d')
            if [ "${#specs[@]}" -eq 0 ]; then
              echo "The spec plan named no files."
              exit 1
            fi
            xvfb-run -a pnpm test:e2e:firefox --pass-with-no-tests "${specs[@]}"
          fi
      - if: success() && steps.plan.outputs.mode != 'none'
        run: pnpm zip:firefox
      - if: success() && steps.plan.outputs.mode != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-zip
          path: extensions/web/.output/*-firefox.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-firefox
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The host: fmt, clippy and tests on all three platforms. A pull request runs cargo test -p on the changed
  # crates and their reverse dependencies; the lockfile, toolchain or a shared crate keeps --workspace. main and
  # the nightly always use --workspace. fmt and clippy stay on the whole workspace.
  cargo:
    name: cargo (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Includes the contract: the shared fixture corpus decodes, and src/generated.rs matches
      # contract/protocol.schema.json. INKUP_LAN_TESTS runs the tests that listen beyond loopback, off by default so a
      # local run does not set off a macOS firewall prompt. bash on Windows too: the selector is a shell script.
      - name: Test the changed crates
        shell: bash
        env:
          INKUP_LAN_TESTS: "1"
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eo pipefail
          plan="$RUNNER_TEMP/cargo-plan.txt"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            printf 'workspace\n' | tee "$plan"
          elif [ -z "$BASE_SHA" ] || ! files=$(git diff --name-only "$BASE_SHA...HEAD"); then
            echo "No base to diff against; testing the whole workspace."
            printf 'workspace\n' | tee "$plan"
          else
            printf '%s\n' "$files" | node ../scripts/affected-crates.ts | tee "$plan"
          fi
          {
            echo "### cargo test"
            echo '```'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mode=$(head -n 1 "$plan")
          if [ "$mode" = none ]; then
            echo "No crate tests for this diff."
            exit 0
          fi
          if [ "$mode" = workspace ]; then
            cargo test --workspace --locked
            exit 0
          fi
          pkgs=()
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            pkgs+=(-p "$pkg")
          done < <(tail -n +2 "$plan")
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "The crate plan named no packages."
            exit 1
          fi
          cargo test "${pkgs[@]}" --locked

  # The desktop app (apps/desktop, ADR 0025): its own Cargo workspace, so the host's job never builds Tauri. fmt,
  # clippy and tests for the app crate, and a debug build of the app with its UI, on all three platforms; the UI's
  # typecheck and tests once, on Linux. No bundles: release packaging comes later.
  desktop:
    name: desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # bash on Windows too: under PowerShell, pnpm printed nothing and exited 0 without running.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # What Tauri needs on Linux: WebKitGTK 4.1 for the window, and appindicator for the tray.
      - if: runner.os == 'Linux'
        name: Install WebKitGTK and appindicator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm --version && pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm -C apps/desktop typecheck
      - if: runner.os == 'Linux'
        name: Desktop unit tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            files=$(git diff --name-only "$BASE_SHA...HEAD" || true)
          else
            files=
          fi
          args_text=$(printf '%s\n' "$files" | node scripts/ci-full-suite.ts vitest "$EVENT_NAME" all)
          mapfile -t args <<< "$args_text"
          if printf '%s\n' "${args[@]}" | grep -qx -- --changed; then
            git fetch --no-tags origin main
          fi
          {
            echo "### vitest (desktop)"
            echo '```'
            printf '%s\n' "${args[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm -C apps/desktop exec vitest "${args[@]}"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - working-directory: apps/desktop/src-tauri
        run: cargo fmt --all --check
      - working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: apps/desktop/src-tauri
        run: cargo test --locked
        env:
          INKUP_LAN_TESTS: "1"
      # The UI (vite build) and the app binary, as `pnpm desktop:build` makes them. The check after it fails a build
      # that exits 0 without making anything.
      - run: pnpm desktop:build
      - name: The UI and the app binary were built
        run: |
          ls -l apps/desktop/dist/index.html apps/desktop/src-tauri/target/debug/inkup-desktop${{ runner.os == 'Windows' && '.exe' || '' }}

  # The marketing site (apps/site, ADR 0026): Astro's type check and the static build that site.yml deploys from main.
  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @inkup/site...
      - run: pnpm --filter @inkup/site check
      - run: pnpm --filter @inkup/site build
      - name: The site was built
        run: ls -l apps/site/dist/index.html apps/site/dist/sitemap-index.xml apps/site/dist/robots.txt

  # x86_64 macOS is cross-compiled on Apple silicon (dist-workspace.toml). cargo-dist 0.33.0 runs
  # `rustup target add` from the repo root, so the std is installed for the runner's default toolchain
  # and not for the channel in host/rust-toolchain.toml. This job builds inkup the way that release does:
  # no `rustup target add`, and no toolchain action, which would set RUSTUP_TOOLCHAIN and ignore the file.
  # It fails when the targets line is missing. macos-14 is the release runner and is arm64; an Intel runner
  # already has this target as its host, so the check would pass there without the fix.
  x64-macos:
    name: x86_64 macOS cross
    needs: changes
    if: needs.changes.outputs.x64_macos == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apple silicon runner
        run: |
          machine=$(uname -m)
          echo "uname -m: $machine"
          test "$machine" = arm64
      - name: The pinned toolchain installs the cross target
        run: |
          rustc --version --verbose
          rustup show
          rustup target list --installed
          rustup target list --installed | grep -qx x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host
          key: x86_64-apple-darwin
      - name: Cross-build inkup
        run: cargo build -p inkup --locked --target x86_64-apple-darwin
      - name: The binary is a single x86_64 slice
        run: |
          bin=target/x86_64-apple-darwin/debug/inkup
          lipo -info "$bin"
          file "$bin"
          lipo -info "$bin" | grep -F 'architecture: x86_64'
          file "$bin" | grep -F 'x86_64'
          if lipo -info "$bin" | grep -Eq 'arm64|universal'; then
            echo "expected a single x86_64 slice"
            exit 1
          fi

  # Advisory Impeccable detect on UI changes. Findings are reported. The job fails only when a scan cannot
  # run (detect exit 1). IMPECCABLE_MODE=blocking also fails on primary findings or design-system-* drift; it is
  # off, and switching it on is the maintainer's call. Blocking mode would fail every UI pull request on findings
  # already on the homepage (border-accent-on-rounded and skipped-heading at both viewports).
  # Twenty minutes covers installing Playwright's Chromium and building the site and the desktop UI. The reference
  # job's eight minutes does not include those builds.
  # Rendered scan: the site and the desktop Vite UI, each served to Playwright's Chromium. The extension's pages
  # call chrome.* and do not render as a static site; attaching --cdp needs the e2e browser with the add-on loaded.
  design:
    name: design
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04-arm
    # Twenty minutes: Playwright Chromium, the site build, and the desktop UI build.
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
      IMPECCABLE_MODE: advisory
    permissions:
      contents: read
    steps:
      - name: Native arm64 runner
        run: |
          machine=$(uname -m)
          echo "uname -m: $machine"
          test "$machine" = aarch64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the site and the desktop UI
        run: |
          pnpm --filter @inkup/site build
          pnpm --filter @inkup/desktop ui:build
      - name: Impeccable 4.7.0
        run: |
          set -euo pipefail
          detected=$(pnpm exec impeccable --version)
          echo "impeccable version: $detected"
          test "$detected" = "4.7.0"
      - name: Detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Design check"
            echo "Impeccable 4.7.0 detect. IMPECCABLE_MODE=${IMPECCABLE_MODE} (blocking fails on primary findings or design-system-* drift)."
            echo "Rendered scan: the site and the desktop Vite UI at 1440x900 and 390x844, in Playwright's Chromium."
            echo "The extension's pages call chrome.* and are not a static site. --cdp would need the e2e browser with the add-on loaded."
            echo "Blocking mode would fail on findings already on the homepage (border-accent-on-rounded and skipped-heading)."
          } >> "$GITHUB_STEP_SUMMARY"
          files=
          have_base=0
          if [ -n "${BASE:-}" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && files=$(git diff --name-only --diff-filter=ACMR "$BASE...$HEAD"); then
            have_base=1
          else
            echo "No base to diff against; scanning every UI file."
            files=$(git ls-files)
          fi
          if [ "$have_base" -eq 1 ]; then
            git diff -U0 --diff-filter=ACMR "$BASE...$HEAD" | node scripts/ci-design.ts disables
          fi
          mapfile -t ui_files < <(printf '%s\n' "$files" | node scripts/ci-changes.ts --ui-files)
          if [ "${#ui_files[@]}" -eq 0 ]; then
            echo "No UI files to scan." >> "$GITHUB_STEP_SUMMARY"
          else
            source_json="$RUNNER_TEMP/impeccable-source.json"
            set +e
            pnpm exec impeccable detect --json -- "${ui_files[@]}" > "$source_json"
            scan_exit=$?
            set -e
            node scripts/ci-design.ts summarize source "$source_json" "$scan_exit"
          fi
          test -f apps/site/dist/index.html
          test -f apps/desktop/dist/index.html
          browser=$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")
          test -x "$browser"
          echo "IMPECCABLE_BROWSER=$browser"
          export IMPECCABLE_BROWSER="$browser"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/site/dist > "$RUNNER_TEMP/site-preview.log" 2>&1 &
          site_pid=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory apps/desktop/dist > "$RUNNER_TEMP/desktop-preview.log" 2>&1 &
          desktop_pid=$!
          cleanup() {
            if [ -n "${site_pid:-}" ]; then
              kill "$site_pid" 2>/dev/null || true
            fi
            if [ -n "${desktop_pid:-}" ]; then
              kill "$desktop_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          wait_ready() {
            url=$1
            ready=0
            tries=0
            while [ "$tries" -lt 40 ]; do
              tries=$((tries + 1))
              if curl -sf -o /dev/null "$url"; then
                ready=1
                break
              fi
              sleep 0.25
            done
            test "$ready" = 1
          }
          wait_ready "http://127.0.0.1:4173/"
          wait_ready "http://127.0.0.1:4174/"
          scan_url() {
            label=$1
            viewport=$2
            url=$3
            outfile="$RUNNER_TEMP/impeccable-${label}.json"
            set +e
            pnpm exec impeccable detect --json --viewport "$viewport" -- "$url" > "$outfile"
            scan_exit=$?
            set -e
            node scripts/ci-design.ts summarize "$label" "$outfile" "$scan_exit"
          }
          scan_url rendered-site-1440 1440x900 "http://127.0.0.1:4173/"
          scan_url rendered-site-390 390x844 "http://127.0.0.1:4173/"
          scan_url rendered-desktop-1440 1440x900 "http://127.0.0.1:4174/"
          scan_url rendered-desktop-390 390x844 "http://127.0.0.1:4174/"

  # The one required check. Skipped jobs pass; a failed or cancelled one fails it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, contract-compat, lint, core, extension-chrome, extension-chrome-e2e, extension-firefox, cargo, desktop, site, x64-macos, design]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
