name: Firefox extension release

# Push a tag like inkup-firefox-v0.2.0 on a commit that is already on main.
# The tag must equal inkup-firefox-v + extensions/web/package.json "version" (which becomes the manifest version).
on:
  push:
    tags: ["inkup-firefox-v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      zip: ${{ steps.zip.outputs.name }}
      sources: ${{ steps.zip.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is on main and matches the extension's package.json version
        run: |
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release only commits that passed CI on main."
            exit 1
          fi
          pkg="inkup-firefox-v$(node -p 'require("./extensions/web/package.json").version')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm zip:firefox
      # AMO reviewers rebuild from the sources zip: check that it rebuilds the same add-on.
      - run: bash scripts/verify-sources-zip.sh --no-zip
      - id: zip
        run: |
          echo "name=$(basename extensions/web/.output/*-firefox.zip)" >> "$GITHUB_OUTPUT"
          echo "sources=$(basename extensions/web/.output/*-sources.zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-zips
          path: |
            extensions/web/.output/*-firefox.zip
            extensions/web/.output/*-sources.zip
          # .output is a dot directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

  github-release:
    name: github-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firefox-zips
      - name: Create GitHub Release with the Firefox zip
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  firefox-amo:
    name: firefox-amo
    needs: build
    runs-on: ubuntu-latest
    # Environment is restricted to inkup-firefox-v* tags; see docs/releasing.md.
    environment: firefox-amo
    env:
      # The add-on's gecko id from extensions/web/wxt.config.ts. It is public, so it is not a secret.
      FIREFOX_EXTENSION_ID: "{a8ef2c28-c5c9-44cb-af98-84c05d0a66c7}"
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      FIREFOX_CHANNEL: ${{ vars.FIREFOX_CHANNEL || 'listed' }}
      FIREFOX_SKIP_SUBMIT_REVIEW: ${{ vars.FIREFOX_SKIP_SUBMIT_REVIEW || 'false' }}
    steps:
      - name: Skip when AMO credentials are not configured
        id: creds
        run: |
          for v in FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::notice::$v is not set; skipping addons.mozilla.org upload. See docs/releasing.md."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firefox-zips
          path: extensions/web/dist-release
      - if: steps.creds.outputs.ready == 'true'
        name: Upload to addons.mozilla.org and submit for review
        working-directory: extensions/web
        env:
          ZIP: ${{ needs.build.outputs.zip }}
          SOURCES: ${{ needs.build.outputs.sources }}
        run: pnpm exec wxt submit --firefox-zip "dist-release/$ZIP" --firefox-sources-zip "dist-release/$SOURCES"
