name: Site

# Deploys the marketing site (apps/site, ADR 0026) to GitHub Pages. It runs only from main: on a push that changes the
# site or the versions it shows, by hand, and when a host release (inkup-v*) is published, so the download links point
# at a release that exists. Pull requests never deploy; ci.yml builds the site on them.
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - .github/workflows/site.yml
      - .release-please-manifest.json
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a running one is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12"

jobs:
  build:
    name: build
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'inkup-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # A deploy builds from a clean install, never from a cache a pull request could have written.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @inkup/site...
      # Where Pages serves the site: https://liatrio-labs.github.io under /inkup until the custom domain is live, then
      # https://inkup.liatr.io under /. The SITE_BASE repository variable overrides the path.
      - env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ vars.SITE_BASE || steps.pages.outputs.base_path }}
        run: pnpm --filter @inkup/site build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
