name: Desktop macOS

# The desktop app's signed, notarized DMG, attached to a host release (ADR 0025). It runs on the inkup-v* tag
# release-please pushes, alongside inkup-v-release.yml rather than inside it, so it runs for pre-releases too. A
# maintainer can also build it for an existing tag: `gh workflow run desktop-macos.yml --ref <tag> -f tag=<tag>`. The
# `release` environment holds the signing secrets, waits for a maintainer's approval and takes inkup-v* tags only, so
# dispatch it on the tag, not on main. Only a stable release updates the Homebrew cask.
on:
  push:
    tags: ['inkup-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The host release tag to build the DMG for, e.g. inkup-v0.2.0
        required: true
        type: string

permissions:
  contents: read

# One run per tag. A second run for the same tag waits rather than cancelling a notarization halfway.
concurrency:
  group: desktop-macos-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# No dependency caches: a tag-triggered job that signs a release restores nothing another run could have written
# (zizmor's cache-poisoning), as in release.yml.
env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12"
  RUST_VERSION: "1.98"
  CARGO_TERM_COLOR: always

jobs:
  # Checks the tag before the `release` environment asks for approval: a host release tag (scripts/desktop-tag.ts) that
  # exists on the remote. The build checks out the commit it points at, not the dispatch ref.
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          node scripts/desktop-tag.ts "$TAG" "$REMOTE" > "$RUNNER_TEMP/tag"
          cat "$RUNNER_TEMP/tag"
          cat "$RUNNER_TEMP/tag" >> "$GITHUB_OUTPUT"

  desktop-macos:
    name: desktop-macos
    needs: tag
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    permissions:
      # gh release upload, to the tag's release.
      contents: write
      # gh run list and the jobs API, to wait for dist's formula job (see "Publish the Homebrew cask").
      actions: read
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Both architectures, for a universal app.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "4.0"
          working-directory: apps/desktop
      # Gems exactly as Gemfile.lock pins them.
      - run: bundle install
        working-directory: apps/desktop
        env:
          BUNDLE_FROZEN: "true"

      # fastlane match (read-only) puts the Developer ID Application certificate in a temporary default keychain. The
      # deploy key goes to a file only this user can read: match hands a raw key to ssh-add inside a shell command.
      - name: Signing certificate
        working-directory: apps/desktop
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          DEPLOY_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/match-deploy-key"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          MATCH_GIT_PRIVATE_KEY="$key" bundle exec fastlane mac signing
          rm -f "$key"
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the keychain after match"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "signing as: $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          path="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$path")
          echo "APPLE_API_KEY_PATH=$path" >> "$GITHUB_ENV"

      # Tauri signs with APPLE_SIGNING_IDENTITY (hardened runtime, tauri.conf.json), then notarizes and staples the app
      # with the API key. The version is the tag's, so the app and the host it embeds say the same.
      - name: Build, sign and notarize the app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # A release build: no development stripes on the app's icons (apps/desktop/src-tauri/src/icon.rs).
          INKUP_RELEASE_BUILD: '1'
        run: |
          version="${TAG#inkup-v}"
          pnpm -C apps/desktop tauri build --target universal-apple-darwin --bundles app,dmg \
            --config "{\"version\":\"$version\"}"

      # Tauri notarizes the app inside the DMG, not the DMG. Gatekeeper checks the DMG a user downloads, so it is
      # notarized and stapled too.
      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg="$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Gatekeeper accepts the app and the DMG
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/InkUp.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=2 "$app" 2>&1)"
          grep -q 'Authority=Developer ID Application' <<< "$signature"
          grep -q 'flags=.*runtime' <<< "$signature"
          spctl -a -vvv -t exec "$app"
          spctl -a -vvv -t install "$DMG"
          xcrun stapler validate "$DMG"

      # release-please creates the tag's release as a draft before it pushes the tag, and dist's host job publishes it
      # once the host's artifacts are on it. The DMG goes on whether it is still a draft or already published; this job
      # never publishes it. A release that has not appeared after 30 minutes fails the job.
      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 60); do
            if found="$(gh release view "$TAG" --json tagName 2>&1)"; then
              gh release upload "$TAG" "$DMG" --clobber
              exit 0
            fi
            echo "waiting for the $TAG release to exist: $found"
            sleep 30
          done
          echo "::error::no GitHub Release for $TAG after 30 minutes; create it (release-please does), then re-run this job"
          exit 1

      # The cask's url is the published release's download URL, which a draft does not serve. Wait for dist to publish
      # the release (stable releases only, like the cask step), up to 30 minutes. Then wait for dist's
      # publish-homebrew-formula job, which starts the moment the release is published and pushes to the same tap: its
      # generated push does not retry, so a cask pushed first made it fail (inkup-v0.2.0).
      - name: Wait for the release to be published
        if: ${{ needs.tag.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 60); do
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false" ]; then
              exit 0
            fi
            echo "waiting for inkup-v-release.yml to publish the $TAG release"
            sleep 30
          done
          echo "::error::the $TAG release is still a draft after 30 minutes; once inkup-v-release.yml publishes it, re-run this job"
          exit 1
      - name: Wait for dist's Homebrew formula job
        if: ${{ needs.tag.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 40); do
            run="$(gh run list --workflow inkup-v-release.yml --branch "$TAG" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            status="$([ -n "$run" ] && gh api "repos/$GH_REPO/actions/runs/$run/jobs" \
              --jq '[.jobs[] | select(.name == "publish-homebrew-formula") | .status][0] // empty')"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            echo "waiting for publish-homebrew-formula in inkup-v-release.yml (run ${run:-not found}, ${status:-not started})"
            sleep 15
          done
          # Not fatal: the cask push below rebases and retries, so it lands either way.
          echo "::warning::publish-homebrew-formula has not finished after 10 minutes; pushing the cask anyway"

      # The Homebrew cask, Casks/inkup.rb in liatrio-labs/homebrew-tap, rendered by scripts/cask.ts. Stable releases
      # only (no `-` in the version), the rule dist's publish-homebrew-formula job follows, so a pre-release never
      # touches the tap. A re-run that leaves the cask unchanged pushes nothing; one that rebuilt the DMG pushes its new
      # sha256.
      - name: Publish the Homebrew cask
        if: ${{ needs.tag.outputs.prerelease == 'false' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set"
            exit 1
          fi
          version="${TAG#inkup-v}"
          if [ "$(basename "$DMG")" != "InkUp_${version}_universal.dmg" ]; then
            echo "::error::$DMG is not InkUp_${version}_universal.dmg, the name the cask's url expects"
            exit 1
          fi
          sha="$(shasum -a 256 "$DMG" | cut -d ' ' -f 1)"
          basic="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          echo "::add-mask::$basic"
          auth="AUTHORIZATION: basic $basic"
          tap="$RUNNER_TEMP/homebrew-tap"
          git -c http.extraheader="$auth" clone https://github.com/liatrio-labs/homebrew-tap.git "$tap"
          mkdir -p "$tap/Casks"
          node scripts/cask.ts "$version" "$sha" > "$tap/Casks/inkup.rb"
          cd "$tap"
          git add Casks/inkup.rb
          if git diff --cached --quiet; then
            echo "Casks/inkup.rb is already at $version with this DMG; nothing to push"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "inkup $version (cask)"
          # Rebase onto whatever else reached the tap (the formula) and try again.
          for attempt in 1 2 3 4 5; do
            if git -c http.extraheader="$auth" push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the tap's main"
            git -c http.extraheader="$auth" pull --rebase origin main
            sleep 5
          done
          echo "::error::could not push the cask to liatrio-labs/homebrew-tap after 5 attempts"
          exit 1

      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/match-deploy-key"
          security delete-keychain fastlane_tmp_keychain-db || true
