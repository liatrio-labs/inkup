name: Host dist check

# Checks the host's dist config on pull requests that touch it: inkup-v-release.yml must match what `dist generate`
# writes from dist-workspace.toml, and `dist plan` must succeed for a sample host tag. Also cross-compiles inkup for
# x86_64-apple-darwin on macos-14 (Apple silicon, the release runner). Not a required check, and not part of ci.yml's
# ci-ok gate. inkup-v-release.yml itself runs only on inkup-v* tags. Skipped on release pull requests, like ci.yml.
# The dist job runs on a GitHub-hosted arm64 Linux runner and installs the cargo-dist build for that architecture.
on:
  pull_request:
    paths:
      - dist-workspace.toml
      - host/Cargo.toml
      - host/Cargo.lock
      - host/crates/*/Cargo.toml
      - host/rust-toolchain.toml
      - .github/workflows/inkup-v-release.yml
      - .github/workflows/host-dist-check.yml

permissions:
  contents: read

concurrency:
  group: host-dist-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with cargo-dist-version in dist-workspace.toml. Digests are the official release assets for this
  # version (sha256.sum): x86_64-unknown-linux-gnu and aarch64-unknown-linux-gnu.
  DIST_VERSION: "0.33.0"
  DIST_SHA256_X86_64: "4b3f0a5f0ebbdb798f6db649d01b32ba1518376b6f7a0502b7d92b75cc2c8293"
  DIST_SHA256_AARCH64: "9c554ab21a58ad46eb9b6710f89633ccb26bc2577cf4b0c2d18a5b826a31913e"

jobs:
  dist:
    name: dist
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uname -m is the runner architecture (x86_64 or aarch64; GitHub's runner.arch is X64 or ARM64). An unknown
      # architecture, a missing pin, or a checksum mismatch fails the job.
      - name: Install dist (checksum-verified release binary)
        run: |
          machine="$(uname -m)"
          case "$machine" in
            x86_64)
              target=x86_64-unknown-linux-gnu
              sha="${DIST_SHA256_X86_64}"
              ;;
            aarch64)
              target=aarch64-unknown-linux-gnu
              sha="${DIST_SHA256_AARCH64}"
              ;;
            *)
              echo "::error::unsupported runner architecture: ${machine}"
              exit 1
              ;;
          esac
          if [ -z "${sha}" ]; then
            echo "::error::no pinned SHA-256 for ${target}"
            exit 1
          fi
          archive="cargo-dist-${target}.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/${archive}"
          echo "${sha}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP" "cargo-dist-${target}/dist"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: inkup-v-release.yml is up to date
        run: dist generate --check
      - name: dist plan for a sample host tag
        run: |
          version=$(cargo metadata --manifest-path host/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "inkup") | .version')
          dist plan --tag="inkup-v${version}"

  # The 0.16.0 host release failed in build-local-artifacts (x86_64-apple-darwin): cargo-dist 0.33.0 runs
  # `rustup target add` from the repo root, so the std lands on the runner's default toolchain. Cargo then
  # builds in host/ on the channel in host/rust-toolchain.toml, which does not have the target unless that
  # file lists it. This job does not run `rustup target add` and does not set RUSTUP_TOOLCHAIN (a toolchain
  # action would), so a missing targets line fails the compile the same way. macos-14 is the release runner
  # and is arm64. An Intel runner already has this target as its host std, so the check would pass there
  # without the fix.
  x64-macos:
    name: x86_64-apple-darwin
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apple silicon runner
        run: |
          machine=$(uname -m)
          echo "uname -m: ${machine}"
          test "$machine" = arm64
      - name: Cross-compile inkup for x86_64-apple-darwin
        run: |
          rustc --version --verbose
          rustup show
          cargo build -p inkup --locked --target x86_64-apple-darwin
      - name: The binary is a single x86_64 slice
        run: |
          bin=target/x86_64-apple-darwin/debug/inkup
          lipo -info "$bin"
          file "$bin"
          lipo -info "$bin" | grep -F 'architecture: x86_64'
          file "$bin" | grep -F x86_64
          if file "$bin" | grep -F arm64; then
            echo "::error::binary contains arm64"
            exit 1
          fi
