name: release-please

# Keeps one release pull request open per train (release-please-config.json): `inkup` for the host, `inkup-extension`
# for the Chrome extension and the Firefox add-on. Merging one creates its tag and GitHub Release, and the tag starts
# the train's release workflow: inkup-v-release.yml for `inkup-v*`, release.yml and firefox-release.yml for
# `inkup-extension-v*`. Releases are automatic: each release pull request is set to auto-merge, so it merges once
# ci-ok passes (CI skips every job on it) and the tag goes out with no one reviewing it. See docs/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only used by the github.token fallback. RELEASE_PLEASE_TOKEN carries its own permissions.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Tags, releases and pull requests made with GITHUB_TOKEN start no workflows: the release workflows would not run
      # on the tag, and CI (so ci-ok) would not run on the release pull request.
      - name: Check for RELEASE_PLEASE_TOKEN
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN is not set; falling back to github.token. Release pull requests get no CI run and the tags it creates start no release workflow. See docs/releasing.md."
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The merge must be made with RELEASE_PLEASE_TOKEN too: a push made with GITHUB_TOKEN starts no workflows, so
      # release-please would not run again to tag it.
      - name: Auto-merge the release pull requests
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        if: env.GH_TOKEN != ''
        run: |
          gh pr list -R "$REPO" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number' |
            while read -r pr; do gh pr merge "$pr" -R "$REPO" --auto --squash; done
