# zizmor config, found by pre-commit's and CI's zizmor runs.
#
# inkup-v-release.yml is generated by cargo-dist (`dist generate`, from dist-workspace.toml) and must not be hand edited:
# `dist generate --check` fails on any drift. These findings come from dist's own template and no dist setting changes
# them, so they are ignored for that one file only. Every other workflow is audited in full.
rules:
  # The workflow grants `contents: write` at the top level. Every job needs it or reads the token: host uploads to
  # the draft release release-please created and publishes it (`create-release = false`). It runs only on inkup-v* tag pushes, which only
  # maintainers can make.
  excessive-permissions:
    ignore:
      - inkup-v-release.yml
  # Expansions of github.ref_name (the tag name, which only maintainers can push) and of dist's own plan output
  # (matrix.install_dist.run, matrix.packages_install, matrix.dist_args, needs.plan.outputs.tag and tag-flag), which
  # dist computes from dist-workspace.toml, not from pull request input.
  template-injection:
    ignore:
      - inkup-v-release.yml
  # `container:` comes from dist's plan and is null for every target this repo builds (all run on native runners).
  unpinned-images:
    ignore:
      - inkup-v-release.yml
