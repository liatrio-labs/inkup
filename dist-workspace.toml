# cargo-dist (`dist`) config for the host release train. The host is released when release-please creates an
# `inkup-v<version>` release and tag; see docs/releasing.md and docs/adr/0008-independent-releases-and-host-updates.md.
# .github/workflows/inkup-v-release.yml is generated from this file: change settings here, then run `dist generate`.
[workspace]
members = ["cargo:host/"]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
checksum = "sha256"
# The workflow triggers only on tags starting `inkup-v`, so the extension tags (`inkup-extension-v*`, `inkup-chrome-v*`,
# `inkup-firefox-v*`) never start it.
# dist names the workflow after this: inkup-v-release.yml.
tag-namespace = "inkup-v"
# The installers write the install receipt that `inkup update` reads only when this is on. It also ships the standalone
# `inkup-update`, which `inkup update` makes redundant; it stays for the receipt.
install-updater = true
tap = "liatrio-labs/homebrew-tap"
formula = "inkup"
publish-jobs = ["homebrew"]
# The desktop app's signed, notarized DMG (.github/workflows/desktop-macos.yml, ADR 0025), attached to the release once
# it is published. After announce, not in publish-jobs: those skip pre-releases, and the host release never waits on
# the `release` environment's approval or on Apple's notary.
post-announce-jobs = ["./desktop-macos"]
# release-please creates the GitHub Release (with its changelog) and the tag that starts this workflow, so dist
# uploads to that release instead of creating one (docs/releasing.md).
create-release = false
# No release CI on pull requests; host-dist-check.yml checks this config on host changes instead.
pr-run-mode = "skip"

# Actions pinned by commit, as in the repo's other workflows. Keep these in step with ci.yml and release.yml.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
