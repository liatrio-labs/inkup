<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overlap Fixture</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Each of these covers the whole viewport, over any z-index (content/top-layer.ts). */
    .cover { position: fixed; inset: 0; z-index: 2147483647; background: #3b5bdb; }
    #modal { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 32px; border: 0; background: #2b8a3e; }
    #pop { inset: 0; width: 100vw; height: 100vh; margin: 0; padding: 32px; border: 0; background: #e8590c; }
    /* Not red, the old ink colour: the stage must never pass for ink. */
    #stage { padding: 32px; background: #5f3dc4; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Everything a page can put over a toolbar</h1>
    <p>A fixed element at the maximum z-index added last, a modal dialog, a popover and an element in fullscreen.</p>
    <button id="go-fullscreen" type="button">Fullscreen</button>
  </main>
  <dialog id="modal"><p>A modal dialog</p></dialog>
  <div id="pop" popover="manual"><p>A popover</p></div>
  <div id="stage"><p>The fullscreen stage</p></div>
  <script>
    document.getElementById('go-fullscreen').addEventListener('click', () => document.getElementById('stage').requestFullscreen());
  </script>
</body>
</html>
