# x86_64 macOS is cross-compiled on Apple silicon (dist-workspace.toml). cargo-dist 0.33.0 runs
# `rustup target add` in the dist workspace root, so the std is installed for the runner's default
# toolchain. The build's cargo runs in this directory, on this channel, and does not see that
# install. Listing the target makes rustup install it for this channel.
[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
targets = ["x86_64-apple-darwin"]
