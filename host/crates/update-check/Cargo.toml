[package]
name = "inkup-update-check"
description = "The daily check for a newer inkup release (ADR 0008), for every host: the TUI, `serve` and the desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axoupdater.workspace = true
# TLS comes through axoupdater (the same reqwest); the release's protocol version is read with it.
reqwest = { workspace = true, features = ["rustls"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
inkup-store.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
