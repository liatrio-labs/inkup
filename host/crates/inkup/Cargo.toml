[package]
name = "inkup"
description = "The InkUp host: the server, the store, the TUI and `mcp install`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "inkup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axoupdater.workspace = true
clap.workspace = true
directories.workspace = true
gethostname.workspace = true
# TLS comes through axoupdater (the same reqwest); the skew guard reads GitHub with it.
reqwest = { workspace = true, features = ["rustls"] }
tempfile.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
inkup-protocol.workspace = true
inkup-server.workspace = true
inkup-store.workspace = true
inkup-tui.workspace = true
inkup-update-check.workspace = true

[dev-dependencies]
tungstenite = "0.30"

[lints]
workspace = true

# `publish = false` keeps the crate off crates.io; this opts the binary into dist releases anyway.
[package.metadata.dist]
dist = true
# The release's protocol version, for `inkup update`'s skew guard (ADR 0008). Built from the crate constant, so it
# cannot drift; dist runs this in this crate's directory and uploads the file as a release asset.
[[package.metadata.dist.extra-artifacts]]
artifacts = ["protocol-version.txt"]
build = ["cargo", "run", "--quiet", "--package", "inkup-protocol", "--example", "protocol-version", "--", "protocol-version.txt"]
