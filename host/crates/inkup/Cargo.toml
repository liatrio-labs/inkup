[package]
name = "inkup"
description = "The InkUp host: the server, the store, the TUI and `mcp install`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "inkup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axoupdater.workspace = true
clap.workspace = true
directories.workspace = true
gethostname.workspace = true
reqwest.workspace = true
tempfile.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
inkup-protocol.workspace = true
inkup-server.workspace = true
inkup-store.workspace = true
inkup-tui.workspace = true

[dev-dependencies]
tungstenite = "0.30"

[lints]
workspace = true

# `publish = false` keeps the crate off crates.io; this opts the binary into dist releases anyway.
[package.metadata.dist]
dist = true
