[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
inkup-protocol = { path = "crates/protocol" }
inkup-store = { path = "crates/store" }
inkup-server = { path = "crates/server" }
inkup-tui = { path = "crates/tui" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
gethostname = "1"
hex = "0.4.3"
if-addrs = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
mdns-sd = { version = "0.21.4", default-features = false }
prettyplease = "0.2"
qrcode = { version = "0.14.1", default-features = false }
rmcp = { version = "3.4.1", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
regress = "0.12"
rqrr = { version = "0.11", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = "2"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml_edit = "0.25.11"
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typify = { version = "0.8.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
