# The one crate in the desktop workspace that may use `unsafe`: every Apple framework call the app makes goes
# through its traits. On Linux and Windows it compiles to stubs that answer `Error::Unsupported`.
[package]
name = "inkup-macos"
description = "The InkUp desktop app's macOS helper: panels over every display, behind traits with stubs elsewhere"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
thiserror = "2.0.20"

# The NSPanel binding: objc2 directly, the versions the app's Dock icon already uses (see the panels.rs module doc
# for why not tauri-nspanel). Only the AppKit classes the panels touch.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSColor", "NSPanel", "NSResponder", "NSScreen", "NSUserInterfaceItemIdentification", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry", "NSString"] }

[lints.rust]
# Allowed here only: inkup-desktop keeps `unsafe_code = "forbid"` and reaches AppKit through this crate's traits.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block says why it is sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
